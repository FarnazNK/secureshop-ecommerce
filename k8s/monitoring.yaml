# Local-only monitoring addon. Apply to the same namespace as k8s/local.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 30s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: application
        metrics_path: /metrics
        # Scrape every backend pod through the headless Service below. (The
        # normal "backend" Service would reach a random pod each time.)
        dns_sd_configs:
          - names: ["backend-pods"]
            type: A
            port: 3001
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
  alerts.yml: |
    groups:
      - name: secureshop-payments
        rules:
          - alert: StripeCircuitOpen
            expr: max(secureshop_circuit_state{name="stripe"}) == 2
            for: 1m
            labels: {severity: page}
            annotations:
              summary: Stripe circuit breaker is open; checkout returns 503 (carts are kept).
          - alert: StripeErrorRateHigh
            expr: |
              sum(rate(secureshop_stripe_calls_total{outcome=~"transient_error|rejected_open_circuit"}[5m]))
                / clamp_min(sum(rate(secureshop_stripe_calls_total[5m])), 1e-9) > 0.2
            for: 5m
            labels: {severity: page}
            annotations:
              summary: More than 20% of Stripe calls are failing.
          - alert: WebhookProcessingFailing
            expr: sum(increase(secureshop_payment_events_total{outcome="failed_will_retry"}[15m])) > 0
            labels: {severity: ticket}
            annotations:
              summary: Stripe webhooks are failing to process; the hourly job will retry them.
          - alert: WebhookLagHigh
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(secureshop_webhook_lag_seconds_bucket[10m]))) > 300
            for: 10m
            labels: {severity: ticket}
            annotations:
              summary: Stripe webhooks arrive more than 5 minutes after the event (p95).
      - name: secureshop-api
        rules:
          - alert: ApiErrorRateHigh
            expr: |
              sum(rate(secureshop_http_requests_total{status=~"5.."}[5m]))
                / clamp_min(sum(rate(secureshop_http_requests_total[5m])), 1e-9) > 0.05
            for: 5m
            labels: {severity: page}
            annotations:
              summary: More than 5% of API requests return 5xx.
          - alert: ApiLatencyHigh
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(secureshop_http_duration_seconds_bucket[5m]))) > 1
            for: 10m
            labels: {severity: ticket}
            annotations:
              summary: API p95 latency is above 1 second.
          - alert: RateLimiterBackendErrors
            expr: sum(increase(secureshop_rate_limit_backend_errors_total[10m])) > 0
            labels: {severity: ticket}
            annotations:
              summary: Shared rate limiter can't reach the database (failing open).
          - alert: BackendDown
            expr: up{job="application"} == 0
            for: 2m
            labels: {severity: page}
            annotations:
              summary: A backend pod is not answering /metrics.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      automountServiceAccountToken: false
      containers:
      - name: prometheus
        image: prom/prometheus:v2.55.1
        args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=24h"]
        ports:
        - containerPort: 9090
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: "1"
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
          readOnly: true
        - name: storage
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      automountServiceAccountToken: false
      containers:
      - name: grafana
        image: grafana/grafana:11.2.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: monitoring-secrets
              key: GRAFANA_ADMIN_PASSWORD
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: "false"
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: "1"
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
        volumeMounts:
        - name: datasource
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: storage
          mountPath: /var/lib/grafana
      volumes:
      - name: datasource
        configMap:
          name: grafana-datasource
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
  - port: 3000
    targetPort: 3000
---
# Headless Service: one DNS record per backend pod, for Prometheus only.
apiVersion: v1
kind: Service
metadata:
  name: backend-pods
spec:
  clusterIP: None
  selector:
    app: backend
  ports:
  - name: http
    port: 3001
    targetPort: 3001
