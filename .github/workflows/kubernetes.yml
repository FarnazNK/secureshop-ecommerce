name: kubernetes-manifest-validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-local-kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YAML parser
        run: python -m pip install 'pyyaml>=6,<7'
      - name: Validate demo deployments, services, and security constraints
        run: python k8s/validate.py
