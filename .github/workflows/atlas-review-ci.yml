name: Atlas Review CI
on:
  push:
    paths:
      - 'document-workflow-lab/**'
      - '.github/workflows/atlas-review-ci.yml'
  pull_request:
    paths:
      - 'document-workflow-lab/**'
      - '.github/workflows/atlas-review-ci.yml'
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: document-workflow-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm test
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./document-workflow-lab
          push: false
          tags: atlas-review:ci
